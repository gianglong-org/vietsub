<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Vietsub Studio{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #1d2433;
            --muted: #697386;
            --line: #e5e9f0;
            --paper: #fff;
            --canvas: #f5f7fb;
            --brand: #6558d3;
            --brand-dark: #4e43b7;
            --mint: #dff7ee;
            --danger: #b4233a;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--canvas); }
        a { color: var(--brand-dark); text-decoration: none; }
        a:hover { text-decoration: underline; }
        button, input, select, textarea { font: inherit; }
        .topbar { background: var(--paper); border-bottom: 1px solid var(--line); }
        .nav { max-width: 1180px; min-height: 72px; margin: auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
        .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); font-weight: 800; letter-spacing: -.03em; font-size: 19px; }
        .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; color: white; background: linear-gradient(135deg, #796cf0, #4b42b2); }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a { color: var(--muted); font-weight: 600; }
        .nav-user { color: var(--muted); font-size: 14px; }
        .nav-form { display: inline; }
        .page { max-width: 1180px; margin: auto; padding: 42px 24px 72px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
        .eyebrow { color: var(--brand); text-transform: uppercase; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
        h1 { margin: 7px 0 0; font-size: clamp(28px, 4vw, 38px); line-height: 1.12; letter-spacing: -.04em; }
        h2 { margin: 0 0 16px; font-size: 19px; letter-spacing: -.02em; }
        p { color: var(--muted); line-height: 1.65; }
        .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 28px rgba(34, 43, 70, .045); }
        .card-pad { padding: 24px; }
        .btn { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 44px; padding: 0 17px; border: 1px solid transparent; border-radius: 11px; background: var(--brand); color: white; font-weight: 700; cursor: pointer; transition: transform .15s, background .15s, box-shadow .15s; }
        .btn:hover { background: var(--brand-dark); box-shadow: 0 7px 15px rgba(79, 67, 183, .18); color: white; text-decoration: none; transform: translateY(-1px); }
        .btn:disabled { opacity: .65; cursor: wait; transform: none; }
        .btn-secondary { color: var(--ink); background: white; border-color: var(--line); }
        .btn-secondary:hover { color: var(--ink); background: #f9faff; }
        .btn-small { min-height: 36px; padding: 0 12px; font-size: 13px; }
        .field { margin: 0 0 20px; }
        .field label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
        .field input:not([type=hidden]), .field select, .field textarea, .text-input { width: 100%; min-height: 46px; border: 1px solid #d9deea; border-radius: 10px; padding: 11px 13px; background: #fff; color: var(--ink); outline: none; }
        .field textarea { min-height: 90px; resize: vertical; line-height: 1.55; }
        .field input:focus, .field select:focus, .field textarea:focus, .text-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(101, 88, 211, .12); }
        .help { margin: 7px 0 0; font-size: 12px; }
        .errorlist, .alert-error { color: var(--danger); }
        .errorlist { margin: 7px 0 0; padding-left: 18px; font-size: 13px; }
        .alert { padding: 13px 16px; border-radius: 11px; margin-bottom: 16px; background: #eef0ff; color: #39318a; }
        .alert-error { background: #fff0f1; }
        .muted { color: var(--muted); }
        .small { font-size: 13px; }
        .table-wrap { overflow-x: auto; }
        .jobs-table { width: 100%; border-collapse: collapse; min-width: 650px; }
        .jobs-table th { padding: 13px 16px; color: var(--muted); font-size: 11px; text-align: left; text-transform: uppercase; letter-spacing: .08em; }
        .jobs-table td { padding: 16px; border-top: 1px solid var(--line); vertical-align: middle; }
        .job-title { font-weight: 750; color: var(--ink); }
        .badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 99px; background: #f0efff; color: #5146b0; font-size: 12px; font-weight: 750; white-space: nowrap; }
        .badge[data-status=done] { background: var(--mint); color: #187550; }
        .badge[data-status=failed] { background: #fff0f1; color: var(--danger); }
        .badge[data-status=uploaded] { background: #edf4ff; color: #315e9b; }
        .progress { height: 8px; overflow: hidden; border-radius: 99px; background: #eceef4; }
        .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #796cf0, #50b7a0); transition: width .4s ease; }
        .empty { padding: 56px 24px; text-align: center; }
        .empty-icon { display: grid; place-items: center; width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 20px; background: #f0efff; color: var(--brand); font-size: 28px; }
        .empty h2 { margin-bottom: 4px; }
        .two-col { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); gap: 22px; align-items: start; }
        .stack { display: grid; gap: 18px; }
        .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
        .meta { padding: 14px; background: #f8f9fc; border-radius: 12px; }
        .meta strong { display: block; margin-top: 5px; }
        .segment { padding: 20px; border-bottom: 1px solid var(--line); }
        .segment:last-child { border-bottom: 0; }
        .segment-top { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
        .segment-number { font-weight: 800; }
        .segment-save { min-height: 20px; color: var(--muted); font-size: 12px; }
        .original { padding: 12px 14px; margin: 10px 0 14px; border-left: 3px solid #d8d4ff; border-radius: 0 8px 8px 0; background: #f8f7ff; line-height: 1.6; white-space: pre-wrap; }
        .editor-actions { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
        .upload-drop { padding: 20px; border: 1px dashed #c9c8e7; border-radius: 12px; background: #fafaff; }
        .preview { width: 100%; max-height: 280px; margin-top: 14px; border-radius: 10px; background: #10131a; }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { max-width: 1180px; margin: auto; padding: 0 24px 28px; color: #929aab; font-size: 12px; }
        @media (max-width: 760px) {
            .nav { min-height: 64px; padding: 0 16px; }
            .nav-links { gap: 12px; }
            .nav-user { display: none; }
            .page { padding: 28px 16px 52px; }
            .page-head { align-items: flex-start; flex-direction: column; }
            .two-col { grid-template-columns: 1fr; }
            .meta-grid { grid-template-columns: 1fr; }
            .card-pad { padding: 19px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <nav class="nav" aria-label="Điều hướng chính">
            <a class="brand" href="{% url 'videos:dashboard' %}">
                <span class="brand-mark" aria-hidden="true">V</span>
                <span>Vietsub Studio</span>
            </a>
            <div class="nav-links">
                <a href="{% url 'videos:dashboard' %}">Dự án</a>
                <a class="btn btn-small" href="{% url 'videos:upload' %}">+ Tạo dự án</a>
            </div>
        </nav>
    </header>
    <main class="page">
        {% if messages %}
            {% for message in messages %}
                <div class="alert{% if message.tags == 'error' %} alert-error{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">Vietsub Studio · Không gian xử lý và biên tập phụ đề video</footer>
    {% block scripts %}{% endblock %}
</body>
</html>
